name: Publish stable update feed

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published stable tag to advertise. Leave empty to withdraw all offers.'
        required: false
        type: string

permissions: {}

concurrency:
  group: stratum-stable-feed
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    outputs:
      deploy: ${{ steps.feed.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Prepare and verify feed
        id: feed
        env:
          GH_TOKEN: ${{ github.token }}
          STRATUM_UPDATER_PUBLIC_KEY: ${{ vars.STRATUM_UPDATER_PUBLIC_KEY }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/site"
          mkdir -p "$site/updates"
          echo 'No stable update feed is available.' > "$site/404.html"
          if [[ -n "$RELEASE_TAG" ]]; then
            [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
            if [[ "$GITHUB_EVENT_NAME" == release ]]; then
              latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')
              if [[ "$RELEASE_TAG" != "$latest" ]]; then
                echo "Skipping publication of a tag that is no longer the latest stable release."
                exit 0
              fi
            fi
            work=$(mktemp -d)
            if ! gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$work/release.json"; then
              echo "::error::Could not look up $RELEASE_TAG. Publish its signed stable release before running this workflow."
              exit 1
            fi
            setup="Stratum_${RELEASE_TAG#v}_x64-setup.exe"
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$work" -p "$setup" -p "$setup.sig"
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends minisign
            python3 scripts/build-update-feed.py "$work" "$site/updates/stable.json"
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@v3
        if: steps.feed.outputs.deploy == 'true'
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: prepare
    if: needs.prepare.outputs.deploy == 'true'
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy the verified feed
        id: pages
        uses: actions/deploy-pages@v4
