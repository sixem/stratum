name: Draft Windows Release

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: stratum-windows-draft
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        run: pnpm test

      - name: Build frontend for tests
        run: pnpm build

      - name: Run Windows Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Read app version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          # GitHub ignores target_commitish for an existing lightweight or annotated tag.
          $tag = "refs/tags/v$version"
          $refs = @(git ls-remote origin $tag "$tag^{}")
          if ($LASTEXITCODE -ne 0) { throw "Could not check the release tag." }
          if ($refs.Count -gt 0) {
            $peeled = $refs | Where-Object { $_.EndsWith("^{}") }
            $ref = if ($peeled) { $peeled } else { $refs[0] }
            if (($ref -split '\s+')[0] -ne $env:GITHUB_SHA) {
              throw "$tag already points to a different commit."
            }
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build Tauri bundles
        env:
          STRATUM_UPDATER_PUBLIC_KEY: ${{ vars.STRATUM_UPDATER_PUBLIC_KEY }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:STRATUM_UPDATER_PUBLIC_KEY)) { throw "Release updater public key missing." }
          pnpm tauri build

      - name: Collect release files
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $releaseDir = "dist/release"
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null

          $targetRoot = "src-tauri/target/release"
          $portablePath = Join-Path $targetRoot "stratum.exe"
          if (-not (Test-Path $portablePath)) {
            $portablePath = Join-Path $targetRoot "Stratum.exe"
          }
          if (-not (Test-Path $portablePath)) {
            throw "Portable executable not found in $targetRoot."
          }

          $nsis = Get-ChildItem -Path (Join-Path $targetRoot "bundle/nsis") -Filter "*.exe" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $nsis) {
            throw "NSIS installer not found."
          }

          $msi = Get-ChildItem -Path (Join-Path $targetRoot "bundle/msi") -Filter "*.msi" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $msi) {
            throw "MSI installer not found."
          }

          $portableOut = Join-Path $releaseDir ("Stratum_{0}_portable.exe" -f $version)
          $nsisOut = Join-Path $releaseDir $nsis.Name
          $msiOut = Join-Path $releaseDir $msi.Name

          Copy-Item -Path $portablePath -Destination $portableOut -Force
          Copy-Item -Path $nsis.FullName -Destination $nsisOut -Force
          Copy-Item -Path $msi.FullName -Destination $msiOut -Force

      - name: Sign the update installer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if (!$env:TAURI_SIGNING_PRIVATE_KEY) { throw "Update signing key missing." }
          pnpm exec tauri signer sign --app-version $env:VERSION "dist/release/Stratum_${env:VERSION}_x64-setup.exe"
          if ($LASTEXITCODE -ne 0) { throw "Update signing failed." }

      - name: Upload release artifacts
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stratum-windows-${{ steps.version.outputs.version }}
          path: dist/release/*
          if-no-files-found: error
          overwrite: true

  draft:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist/release

      - name: Verify the signed release assets
        env:
          STRATUM_UPDATER_PUBLIC_KEY: ${{ vars.STRATUM_UPDATER_PUBLIC_KEY }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends minisign
          python3 scripts/verify_update_installer.py dist/release "$VERSION"

      - name: Draft GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Stratum v${{ needs.build.outputs.version }}
          draft: true
          fail_on_unmatched_files: true
          files: |
            dist/release/Stratum_${{ needs.build.outputs.version }}_x64-setup.exe
            dist/release/Stratum_${{ needs.build.outputs.version }}_x64-setup.exe.sig
            dist/release/Stratum_${{ needs.build.outputs.version }}_portable.exe
            dist/release/Stratum_${{ needs.build.outputs.version }}_x64_en-US.msi
          token: ${{ secrets.GH_PAT }}
